    <rect x="22" y="34" width="196" height="132" rx="20" fill="#0d1110" stroke="#5eead4" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="0" y="68" width="196" height="132" rx="20" fill="#0d1110" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="34" cy="102" r="12" fill="#c5ff4a" stroke="none"/>
    <path d="M58 96h70M58 110h44" stroke="#e8eee9" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M24 142h148M24 160h104" stroke="#e8eee9" stroke-opacity="0.3" stroke-width="5"/>
    <circle cx="196" cy="68" r="22" fill="#c5ff4a" stroke="none"/>
    <text x="196" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#070908" stroke="none">41</text>
