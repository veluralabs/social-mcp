  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <g font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="64" width="186" height="38" rx="19" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="94" cy="83" r="5" fill="#c5ff4a"/>
    <text x="110" y="89" font-size="15" font-weight="600" letter-spacing="2.2" fill="#e8eee9">VELURA LABS</text>

    <text x="72" y="196" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#e8eee9">Social <tspan fill="url(#accent)">MCP</tspan></text>
    <text x="74" y="252" font-size="28" fill="#9aa39e">Let any AI agent run your social media.</text>

    <g font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e8eee9">
      <rect x="72" y="306" width="118" height="42" rx="21" fill="#c5ff4a"/>
      <text x="131" y="333" text-anchor="middle" fill="#070908" font-weight="700">41 tools</text>
