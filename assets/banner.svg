      <rect x="570" y="306" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="645" y="333" text-anchor="middle">MIT licensed</text>
